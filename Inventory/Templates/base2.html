<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://bootswatch.com/5/yeti/bootstrap.min.css" rel="stylesheet">
  <title>Marine Custom Solutions Inventory</title>
  <style>
    .btn-wide {
        width: 5rem; 
      }
    .btn-yellow {
      background-color: #fae043;
      }
    .popup-message {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    background-color: #01acca;
    color: white;
    padding: 15px;
    text-align: center;
    display: none;
    }

    .white-text {
      background-color: white;
      color: darkblue;
      border: none;
      height: 10px;
    }

    .yellow-button {
      background-color: yellow;
      color: blueviolet;
      border: navajowhite;
    }
    .marine-color {
      background-color: #01acca;
    }

    .marine-text {
      color: #01acca;
    }

    .horizontal-form .form-row {
      display: flex;
      align-items: baseline;
    }
  
    .horizontal-form .form-group {
      margin-right: 10px;  /* Adjust the margin as needed */
    }

    .btn-square {
      width: 330px; /* Adjust the width */
      height: 300px; /* Adjust the height */
      background-color: #01acca; /* Adjust the background color */
      border: none;
      border-radius: 0px;
      cursor: pointer;
      overflow: hidden;
      position: relative;
    }
  
    .btn-square img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 1; /* Adjust the opacity for transparency */
    }
  </style>
</head>
<body>
  {% include 'navigation2.html' %}
  {% block content %}
  {% endblock content%}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa" crossorigin="anonymous"></script>

</html>
