{% extends "base.html" %}
{% load static %}

  
{% block content %}
<style>
   .dashboard-button {
    width: 270px;
    height: 270px;
    margin: 15px;
    font-size: 30px;
    background-color: #6DB2EE;
    border: none;
    color: white;
    text-align: center;
    text-decoration: none;
    display: flex;
    align-items: center; /* Align text vertically */
    justify-content: center; /* Align text horizontally */
    cursor: pointer;
    border-radius: 5px;
    background-size: cover;
    background-position: center;
  }
</style>
<div class="container mt-5">
  <div class="row justify-content-center text-center"> <!-- Added justify-content-center -->
    <div class="col-lg-3 col-md-6 col-sm-8">
      <a href="{% url 'QR-login' %}">
        <button class="btn dashboard-button" style="background-image: url({% static 'images/QRcode.png' %});">
        </button>
      </a>
    </div>
    <div class="col-lg-3 col-md-6 col-sm-8">
      <a href="{% url 'login' %}">
        <button class="btn dashboard-button" style="background-image: url({% static 'images/password.png' %});">
        </button>
      </a>
    </div>
  </div>
</div>



{% endblock %}
