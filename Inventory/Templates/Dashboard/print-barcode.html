{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-5">
  <h2 class="marine-text">Select the product to print a barcode for.</h2>
  <form method="POST" class="horizontal-form">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Submit</button>
  </form>

  <!-- Table to display items -->
  <table class="table mt-4">
    <thead>
      <tr>
        <th scope="col">Product</th>
        <th scope="col">Part Number</th>
        <th scope="col"></th>
      </tr>
    </thead>
    <tbody>
      {% for item in items %}
        <tr>
          <td>{{ item.title }}</td>
          <td>{{ item.product_ID }}</td>
          <td>
            <!-- Button next to each item -->
            <button type="button" class="printBarcode btn btn-secondary" data-id="{{ item.id }}">Print Barcode</button>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script>
    $(document).ready(function () {
      var count = 1;

      var successMessage = document.createElement('div');
      successMessage.setAttribute('class', 'text-success mt-2');
  
      var errorMessage = document.createElement('div');
      errorMessage.setAttribute('class', 'text-danger mt-2');

      document.body.appendChild(successMessage);
        $(".printBarcode").click(function () {
            console.log("This is working");
            var productId = $(this).data('id');

            $.ajax({
                url: "/dashboard/print-barcode/",
                type: "POST",
                data: {
                  'product_ID': productId,
                  'printBarcode': 'true', 
                  'csrfmiddlewaretoken': $('[name="csrfmiddlewaretoken"]').val()
              },
                success: function (data) {
                  successMessage.textContent = `Barcode print request sent! (${count}x)`;
                  count = count + 1;
                  $('.btn-primary').after(successMessage);
                },
                error: function (xhr, status, error) {
                  console.error("Error:", error);
                  errorMessage.textContent = "Unknown error has occured, please try again";
                  $('.btn-primary').after(errorMessage);
                }
            });
        });
    });
</script>
{% endblock content %}
