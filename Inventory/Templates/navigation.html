{% load static %}
<style>
  .nav-text {
    color: #1c2e3e;
    font-size: 33px;
  }
  .container-height {
    height: 70px;
  }
  .expanded-nav-margin {
    margin-top: 50px;
  }
  .responsive-image {
    width: 120px;
    height: auto;
  }
</style>


<nav class="navbar navbar-expand-lg marine-color">
  <div class="container-fluid">
    <img class="responsive-image" src="{% static 'images/mcs_logo.png' %}" alt="mcs logo">
    <a class="navbar-brand nav-text" href="{% url 'home' %}">MCS Inventory Manager</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        {% if user.is_authenticated %}
          <li class="nav-item">
            <a class="nav-link nav-text" href="#">{{user.username}}</a>
          </li>
          <li class="nav-item">
            <form class="nav-text" method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button type="submit" class="nav-link" style="border: none; background: none; cursor: pointer;">Sign out</button>
            </form>
          </li>
        {% else %}
          <li class="nav-item nav-text">
            <a class="nav-link text-color" href="{% url 'login' %}">Login</a>
          </li>
          <li class="nav-item nav-text">
            <a class="nav-link" href="{% url 'signup' %}">Sign Up</a>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
