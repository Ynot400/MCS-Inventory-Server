{% extends "base.html" %}

{% block title %}QRCode Login{% endblock %}

{% block content %}

<form id="scannedDataForm" method="post" action="{% url 'QR-login' %}">
    {% csrf_token %}
    <input type="hidden" name="scannedData" id="scannedDataInput">
    <input type="submit" style="display: none;">
</form>

{% if error %}
<div class="alert alert-dismissible alert-danger">
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    <strong>{{error}}</strong>
</div>
{% endif %}


<div class="container mt-4">
  <div class="row justify-content-center">
      <div class="col-md-12 col-lg-12 col-sm-12">
          <div class="card">
              <div class="card-header">
                  <h2 class="text-center">Scan your Employee QRCode</h2>
              </div>
              <div class="card-body text-center">
                  <p class="lead">You will be Redirected if Successful</p>
              </div>
          </div>
      </div>
  </div>
  <a href="{% url 'login' %}">
    <button class="btn btn-primary mt-3">Login with Username and Password</button>
  </a>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        let scannedData = "";

        document.addEventListener("keypress", function(event) {
            event.preventDefault();
            if (event.key === "Enter") {
                if (scannedData.length > 10) {
                    document.getElementById('scannedDataInput').value = scannedData;
                    document.getElementById('scannedDataForm').submit();
                }
            } else {
                scannedData += event.key;
            }
        });

    });
</script>
{% endblock %}
